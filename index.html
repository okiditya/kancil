<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pelangi di Kebun Kancil - Flip Book Anak</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --book-bg: #FFFDF7;
      --paper-shadow: rgba(139, 108, 66, 0.18);
      --spine-shadow: rgba(92, 68, 38, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: radial-gradient(circle at 20% 20%, #FEF6E4 0%, #F3E9D2 45%, #E6D7B9 100%);
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: #4A3B32;
    }

    /* Tekstur kertas lembut */
    .paper-texture {
      background-color: var(--book-bg);
      background-image: 
        radial-gradient(rgba(210, 180, 140, 0.12) 1px, transparent 0),
        radial-gradient(rgba(180, 150, 110, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    /* Perspektif 3D Buku */
    .book-stage {
      perspective: 1800px;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .book-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 3 / 4.15;
      max-height: 74dvh;
      transform-style: preserve-3d;
    }

    @media (min-width: 768px) {
      .book-wrapper {
        max-width: 540px;
        max-height: 76dvh;
      }
    }

    /* Tumpukan belakang buku untuk efek tebal */
    .book-back-stack {
      position: absolute;
      inset: 4px -6px -6px 6px;
      background: linear-gradient(135deg, #EADBC2 0%, #D5C1A0 100%);
      border-radius: 12px 24px 24px 12px;
      box-shadow: 0 18px 36px -8px rgba(74, 59, 50, 0.28);
      z-index: 0;
    }

    /* Lembaran halaman 3D */
    .page-sheet {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      border-radius: 10px 24px 24px 10px;
      cursor: pointer;
    }

    .page-sheet.flipped {
      transform: rotateY(-180deg);
    }

    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px 24px 24px 10px;
      overflow: hidden;
      box-shadow: 
        inset 14px 0 24px -10px var(--spine-shadow),
        inset -2px 0 6px rgba(255, 255, 255, 0.8),
        0 6px 18px var(--paper-shadow);
      border: 2px solid #F0E3CC;
      display: flex;
      flex-direction: column;
    }

    /* Bagian belakang halaman saat dibalik */
    .page-back {
      transform: rotateY(180deg);
      border-radius: 24px 10px 10px 24px;
      background: linear-gradient(90deg, #FBF6EC 0%, #F3E7D3 94%, #E3D2B6 100%);
      box-shadow: inset -14px 0 24px -10px var(--spine-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Lipatan jilid buku di sisi kiri */
    .spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 22px;
      background: linear-gradient(90deg, 
        rgba(92, 68, 38, 0.22) 0%, 
        rgba(255, 255, 255, 0.35) 35%, 
        rgba(92, 68, 38, 0.08) 70%, 
        transparent 100%);
      pointer-events: none;
      z-index: 20;
    }

    /* Efek animasi ilustrasi */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    @keyframes hopBounce {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      30% { transform: translateY(3px) scaleY(0.94); }
      60% { transform: translateY(-16px) scaleY(1.04); }
    }

    @keyframes rainDrop {
      0% { transform: translateY(-10px); opacity: 0; }
      30% { opacity: 0.85; }
      100% { transform: translateY(28px); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes rainbowPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    .anim-float { animation: floatSlow 3.5s ease-in-out infinite; }
    .anim-hop { animation: hopBounce 1.8s ease-in-out infinite; transform-origin: bottom center; }
    .anim-rain-1 { animation: rainDrop 1.1s linear infinite; }
    .anim-rain-2 { animation: rainDrop 1.3s linear infinite 0.4s; }
    .anim-rain-3 { animation: rainDrop 1.0s linear infinite 0.7s; }
    .anim-twinkle { animation: twinkle 2.2s ease-in-out infinite; }
    .anim-rainbow { animation: rainbowPulse 3s ease-in-out infinite; }

    /* Tombol menggemaskan */
    .btn-kid {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .btn-kid:active:not(:disabled) {
      transform: scale(0.93) translateY(2px);
    }
    .btn-kid:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* Sorotan sudut halaman untuk mengajak disentuh */
    .corner-hint {
      position: absolute;
      bottom: 10px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D97706;
      font-size: 14px;
      pointer-events: none;
      animation: floatSlow 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <!-- Header Kontrol Atas -->
  <header class="w-full max-w-2xl mx-auto px-4 pt-3 pb-1 flex items-center justify-between gap-2 z-30">
    <div class="flex items-center gap-2 bg-white/80 backdrop-blur-sm px-3.5 py-1.5 rounded-full shadow-sm border border-amber-200/80">
      <span class="text-xl" aria-hidden="true">🦌</span>
      <span class="font-bold text-amber-900 text-sm sm:text-base tracking-wide">Halaman <span id="pageIndicator">1</span> / 8</span>
    </div>

    <div class="flex items-center gap-2">
      <!-- Tombol Bacakan Cerita (TTS) -->
      <button id="btnReadAloud" type="button" aria-label="Bacakan cerita"
        class="btn-kid flex items-center gap-1.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-3.5 py-2 rounded-full shadow-md border-b-4 border-amber-600 text-sm sm:text-base">
        <svg id="iconSpeaker" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
        </svg>
        <span id="readAloudLabel">Bacakan</span>
      </button>

      <!-- Tombol Efek Suara (Mute/Unmute) -->
      <button id="btnSoundToggle" type="button" aria-label="Aktifkan atau matikan efek suara"
        class="btn-kid flex items-center justify-center bg-emerald-400 hover:bg-emerald-500 text-emerald-950 font-bold p-2.5 rounded-full shadow-md border-b-4 border-emerald-600"
        title="Efek Suara">
        <svg id="iconSoundOn" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z" />
        </svg>
        <svg id="iconSoundOff" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Area Utama Buku Flip 3D -->
  <main class="book-stage" id="bookStage">
    <div class="book-wrapper" id="bookWrapper">
      <div class="book-back-stack"></div>
      <!-- Halaman-halaman akan dirender melalui JavaScript -->
    </div>
  </main>

  <!-- Navigasi Bawah -->
  <footer class="w-full max-w-xl mx-auto px-4 pb-4 pt-1 flex flex-col items-center gap-2 z-30">
    <!-- Titik Indikator Halaman -->
    <div id="dotsContainer" class="flex items-center justify-center gap-2 py-1" role="tablist" aria-label="Pilih halaman"></div>

    <!-- Tombol Sebelumnya & Selanjutnya -->
    <div class="w-full flex items-center justify-between gap-3">
      <button id="btnPrev" type="button"
        class="btn-kid flex-1 flex items-center justify-center gap-2 bg-sky-400 hover:bg-sky-500 text-sky-950 font-extrabold py-3 px-4 rounded-2xl shadow-md border-b-4 border-sky-600 text-base sm:text-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span>Sebelumnya</span>
      </button>

      <button id="btnNext" type="button"
        class="btn-kid flex-1 flex items-center justify-center gap-2 bg-rose-400 hover:bg-rose-500 text-white font-extrabold py-3 px-4 rounded-2xl shadow-md border-b-4 border-rose-600 text-base sm:text-lg">
        <span id="btnNextText">Buka Buku</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </footer>

  <!-- Kotak Pesan Notifikasi (Pengganti alert) -->
  <div id="toastMessage" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-amber-900/90 text-amber-50 text-sm font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center max-w-[90vw]">
  </div>

  <script>
    /**
     * =========================================================================
     * MESIN SUARA LEMBUT (WEB AUDIO API) - TANPA FILE EKSTERNAL
     * =========================================================================
     */
    class GentleSoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      // Suara kertas dibalik lembut
      playPageFlip() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const duration = 0.24;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.25;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.exponentialRampToValueAtTime(1400, now + duration);
        filter.Q.value = 1.2;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
      }

      // Efek suara tematik tiap halaman
      playSceneEffect(pageIndex) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        switch (pageIndex) {
          case 0: // Sampul: denting ceria pembuka
            this.playNotes([523.25, 659.25, 783.99], 0.12, 'sine', 0.14);
            break;

          case 1: // Halaman 2: Lompatan ceria "Hop! Hop! Hop!"
            [0, 0.22, 0.44].forEach((offset, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              const baseFreq = 340 + idx * 45;
              osc.frequency.setValueAtTime(baseFreq, now + offset);
              osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + offset + 0.14);

              gain.gain.setValueAtTime(0.001, now + offset);
              gain.gain.linearRampToValueAtTime(0.16, now + offset + 0.03);
              gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.16);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + 0.17);
            });
            break;

          case 2: // Halaman 3: Rintik hujan "Tik... tik... tik..."
            [0, 0.25, 0.5, 0.72].forEach((offset, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              const freq = [880, 784, 987, 830][idx];
              osc.frequency.setValueAtTime(freq, now + offset);
              osc.frequency.exponentialRampToValueAtTime(freq * 0.75, now + offset + 0.09);

              gain.gain.setValueAtTime(0.12, now + offset);
              gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + 0.11);
            });
            break;

          case 3: // Halaman 4: Matahari mengintip hangat
            this.playNotes([440, 554.37, 659.25], 0.18, 'triangle', 0.12);
            break;

          case 4: // Halaman 5: Pelangi muncul (arpeggio harp magis)
            this.playNotes([523.25, 587.33, 659.25, 783.99, 880, 1046.5], 0.11, 'sine', 0.14);
            break;

          case 5: // Halaman 6: Gelembung berkilau "Cling! Cling!"
            [0, 0.28, 0.52].forEach((offset, i) => {
              this.playSingleTone(1174.66 + i * 220, now + offset, 0.22, 'sine', 0.13);
            });
            break;

          case 6: // Halaman 7: Sore hari tenang & menguap
            {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(420, now + 0.1);
              osc.frequency.linearRampToValueAtTime(490, now + 0.45);
              osc.frequency.exponentialRampToValueAtTime(280, now + 0.95);

              gain.gain.setValueAtTime(0.001, now + 0.1);
              gain.gain.linearRampToValueAtTime(0.12, now + 0.4);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.98);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + 0.1);
              osc.stop(now + 1.0);
            }
            break;

          case 7: // Halaman 8: Lullaby pengantar tidur lembut
            this.playNotes([659.25, 523.25, 587.33, 392.00], 0.34, 'sine', 0.13);
            break;
        }
      }

      playSingleTone(freq, startTime, duration, type = 'sine', volume = 0.12) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playNotes(freqs, stepTime, type = 'sine', volume = 0.13) {
        const now = this.ctx.currentTime;
        freqs.forEach((f, idx) => {
          this.playSingleTone(f, now + idx * stepTime, stepTime * 2.2, type, volume);
        });
      }
    }

    /**
     * =========================================================================
     * KOLEKSI ILUSTRASI SVG GAYA CAT AIR PASTEL (HANGAT & RAMAH ANAK)
     * =========================================================================
     */
    const SVG_DEFS = `
      <defs>
        <!-- Filter efek tepi cat air lembut -->
        <filter id="watercolorBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
          <stop offset="65%" stop-color="#FACC15" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="meadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#BEF264" />
          <stop offset="100%" stop-color="#86EFAC" />
        </linearGradient>
        <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FDBA74" />
          <stop offset="55%" stop-color="#FDE68A" />
          <stop offset="100%" stop-color="#FEF9C3" />
        </linearGradient>
        <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#312E81" />
          <stop offset="65%" stop-color="#4338CA" />
          <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
      </defs>
    `;

    // Helper menggambar karakter Kancil Kecil yang menggemaskan dalam berbagai pose
    function drawKancil({ x = 200, y = 165, scale = 1, pose = 'happy', flipX = false }) {
      const transform = `translate(${x}, ${y}) scale(${flipX ? -scale : scale}, ${scale})`;
      
      // Ekspresi mata
      let eyes = `
        <circle cx="-14" cy="-34" r="4.2" fill="#3E2723" />
        <circle cx="-12.5" cy="-35.5" r="1.5" fill="#FFFFFF" />
        <circle cx="14" cy="-34" r="4.2" fill="#3E2723" />
        <circle cx="15.5" cy="-35.5" r="1.5" fill="#FFFFFF" />
      `;
      if (pose === 'lookup') {
        eyes = `
          <circle cx="-14" cy="-37" r="4.5" fill="#3E2723" />
          <circle cx="-13" cy="-38.5" r="1.7" fill="#FFFFFF" />
          <circle cx="14" cy="-37" r="4.5" fill="#3E2723" />
          <circle cx="15" cy="-38.5" r="1.7" fill="#FFFFFF" />
        `;
      } else if (pose === 'sleep' || pose === 'yawn') {
        eyes = `
          <path d="M -19 -34 Q -14 -29 -9 -34" stroke="#3E2723" stroke-width="2.8" fill="none" stroke-linecap="round"/>
          <path d="M 9 -34 Q 14 -29 19 -34" stroke="#3E2723" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        `;
      }

      // Mulut
      let mouth = `<path d="M -5 -22 Q 0 -17 5 -22" stroke="#4E342E" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
      if (pose === 'yawn') {
        mouth = `<ellipse cx="0" cy="-19" rx="6.5" ry="8" fill="#F43F5E" stroke="#4E342E" stroke-width="2"/>`;
      } else if (pose === 'cheer' || pose === 'hop') {
        mouth = `<path d="M -6 -22 Q 0 -13 6 -22 Z" fill="#FB7185" stroke="#4E342E" stroke-width="2"/>`;
      }

      // Kaki dan tangan sesuai pose
      let limbs = `
        <!-- Kaki duduk / berdiri santai -->
        <ellipse cx="-18" cy="36" rx="11" ry="7" fill="#C68B59" />
        <ellipse cx="18" cy="36" rx="11" ry="7" fill="#C68B59" />
        <path d="M -12 8 L -14 34" stroke="#B07443" stroke-width="8" stroke-linecap="round"/>
        <path d="M 12 8 L 14 34" stroke="#B07443" stroke-width="8" stroke-linecap="round"/>
      `;

      if (pose === 'hop' || pose === 'run') {
        limbs = `
          <!-- Kaki melompat riang -->
          <path d="M -16 14 L -32 32" stroke="#B07443" stroke-width="8.5" stroke-linecap="round"/>
          <path d="M 16 14 L 34 26" stroke="#B07443" stroke-width="8.5" stroke-linecap="round"/>
          <path d="M -10 2 L -26 -6" stroke="#C68B59" stroke-width="7.5" stroke-linecap="round"/>
          <path d="M 10 2 L 26 -10" stroke="#C68B59" stroke-width="7.5" stroke-linecap="round"/>
        `;
      } else if (pose === 'cheer') {
        limbs = `
          <!-- Tangan bertepuk senang -->
          <ellipse cx="-16" cy="36" rx="10" ry="6.5" fill="#B07443" />
          <ellipse cx="16" cy="36" rx="10" ry="6.5" fill="#B07443" />
          <path d="M -14 4 L -24 -12" stroke="#C68B59" stroke-width="7.5" stroke-linecap="round"/>
          <path d="M 14 4 L 24 -12" stroke="#C68B59" stroke-width="7.5" stroke-linecap="round"/>
        `;
      } else if (pose === 'sleep') {
        limbs = `

        dot.className = 'w-3 h-3 rounded-full transition-all duration-300 bg-amber-300 hover:bg-amber-400';
        dot.setAttribute('aria-label', `Ke halaman ${index + 1}`);
        dot.addEventListener('click', () => goToPage(index));
        dotsContainer.appendChild(dot);
      });

      updateUIState(false);
    }

    // Perbarui posisi 3D seluruh lembaran halaman
    function updateUIState(playAudio = true) {
      const sheets = bookWrapper.querySelectorAll('.page-sheet');
      sheets.forEach((sheet, idx) => {
        if (idx < currentPage) {
          sheet.classList.add('flipped');
          // Halaman yang sudah dibalik ditumpuk di kiri dengan urutan naik
          sheet.style.zIndex = idx + 1;
        } else {
          sheet.classList.remove('flipped');
          // Halaman yang belum dibalik ditumpuk di kanan dengan urutan turun
          sheet.style.zIndex = STORY_PAGES.length - idx + 10;
        }
      });

      // Perbarui indikator teks & titik
      pageIndicator.textContent = currentPage + 1;
      const dots = dotsContainer.querySelectorAll('button');
      dots.forEach((dot, idx) => {
        if (idx === currentPage) {
          dot.className = 'w-7 h-3 rounded-full transition-all duration-300 bg-amber-600 shadow-sm';
        } else {
          dot.className = 'w-3 h-3 rounded-full transition-all duration-300 bg-amber-300 hover:bg-amber-400';
        }
      });

      // Perbarui tombol Sebelumnya & Selanjutnya
      btnPrev.disabled = currentPage === 0;
      if (currentPage === 0) {
        btnNextText.textContent = 'Buka Buku';
        btnNext.disabled = false;
      } else if (currentPage === STORY_PAGES.length - 1) {
        btnNextText.textContent = 'Selesai';
        btnNext.disabled = true;
      } else {
        btnNextText.textContent = 'Selanjutnya';
        btnNext.disabled = false;
      }

      // Hentikan pembacaan suara sebelumnya jika pindah halaman
      stopSpeech();

      if (playAudio) {
        soundEngine.playPageFlip();
        setTimeout(() => {
          soundEngine.playSceneEffect(currentPage);
        }, 260);
      }
    }

    function goToPage(targetIndex) {
      const clamped = Math.max(0, Math.min(STORY_PAGES.length - 1, targetIndex));
      if (clamped === currentPage) return;
      currentPage = clamped;
      updateUIState(true);
    }

    /**
     * =========================================================================
     * FITUR PEMBACA CERITA OTOMATIS (WEB SPEECH API - BAHASA INDONESIA)
     * =========================================================================
     */
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isReading = false;
      readAloudLabel.textContent = 'Bacakan';
      btnReadAloud.classList.remove('ring-4', 'ring-amber-300');
    }

    function toggleReadAloud() {
      if (!('speechSynthesis' in window)) {
        showToast('Peramban ini belum mendukung fitur suara otomatis.');
        return;
      }

      if (isReading) {
        stopSpeech();
        return;
      }

      soundEngine.init();
      window.speechSynthesis.cancel();

      const textToRead = STORY_PAGES[currentPage].text;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'id-ID';
      utterance.rate = 0.88;  // Sedikit lebih lambat & jelas untuk anak usia 4 tahun
      utterance.pitch = 1.12; // Nada hangat & ramah

      // Cari suara bahasa Indonesia jika tersedia di perangkat
      const voices = window.speechSynthesis.getVoices();
      const idVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('id'));
      if (idVoice) {
        utterance.voice = idVoice;
      }

      utterance.onstart = () => {
        isReading = true;
        readAloudLabel.textContent = 'Berhenti';
        btnReadAloud.classList.add('ring-4', 'ring-amber-300');
      };

      utterance.onend = () => {
        isReading = false;
        readAloudLabel.textContent = 'Bacakan';
        btnReadAloud.classList.remove('ring-4', 'ring-amber-300');
      };

      utterance.onerror = () => {
        isReading = false;
        readAloudLabel.textContent = 'Bacakan';
        btnReadAloud.classList.remove('ring-4', 'ring-amber-300');
      };

      window.speechSynthesis.speak(utterance);
    }

    // Event Listener Tombol Navigasi & Kontrol
    btnPrev.addEventListener('click', () => goToPage(currentPage - 1));
    btnNext.addEventListener('click', () => goToPage(currentPage + 1));
    btnReadAloud.addEventListener('click', toggleReadAloud);

    btnSoundToggle.addEventListener('click', () => {
      const isMuted = soundEngine.toggleMute();
      if (isMuted) {
        iconSoundOn.classList.add('hidden');
        iconSoundOff.classList.remove('hidden');
        btnSoundToggle.classList.replace('bg-emerald-400', 'bg-stone-300');
        btnSoundToggle.classList.replace('border-emerald-600', 'border-stone-500');
        showToast('Efek suara dimatikan');
      } else {
        iconSoundOn.classList.remove('hidden');
        iconSoundOff.classList.add('hidden');
        btnSoundToggle.classList.replace('bg-stone-300', 'bg-emerald-400');
        btnSoundToggle.classList.replace('border-stone-500', 'border-emerald-600');
        soundEngine.playSceneEffect(currentPage);
        showToast('Efek suara dinyalakan');
      }
    });

    // Dukungan Navigasi Keyboard (Panah Kiri & Kanan)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        goToPage(currentPage + 1);
      } else if (e.key === 'ArrowLeft') {
        goToPage(currentPage - 1);
      }
    });

    // Dukungan Gestur Geser (Touch Swipe) untuk Layar Sentuh / Tablet / Ponsel
    let touchStartX = 0;
    let touchStartY = 0;
    const bookStage = document.getElementById('bookStage');

    bookStage.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    bookStage.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      // Pastikan geseran horizontal dominan
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) {
          // Geser ke kiri -> Halaman berikutnya
          goToPage(currentPage + 1);
        } else {
          // Geser ke kanan -> Halaman sebelumnya
          goToPage(currentPage - 1);
        }
      }
    }, { passive: true });

    // Muat daftar suara TTS lebih awal jika didukung
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Inisialisasi Buku saat halaman selesai dimuat
    window.addEventListener('DOMContentLoaded', () => {
      renderBook();
    });
  </script>
</body>
</html>
